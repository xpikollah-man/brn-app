<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPIKOLLAH ELITE HUB V4</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #f1c40f; --blue: #00d2ff; --red: #ff4444; --green: #00ff88; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        
        /* CARDS */
        .app-card, .analytics-card { background: #141414; border: 1px solid #333; border-radius: 28px; width: 100%; max-width: 420px; padding: 25px; box-sizing: border-box; margin-bottom: 15px; position: relative; }
        .panel-title { font-size: 14px; font-weight: bold; color: var(--gold); text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* CLOCK & SESSIONS */
        .master-clock-section { background: rgba(255,255,255,0.03); width: 100%; max-width: 420px; padding: 20px; border-radius: 28px; border: 1px solid #222; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .overlap-badge { position: absolute; top: 15px; right: 25px; opacity: 0.1; transition: 0.5s; font-size: 28px; }
        .overlap-active { opacity: 1; filter: drop-shadow(0 0 10px var(--gold)); }
        
        .session-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 420px; gap: 10px; margin-bottom: 15px; }
        .glass-item { background: #151515; padding: 15px 5px; border-radius: 15px; border: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        .glass-tube { width: 18px; height: 70px; display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; overflow: hidden; }
        .block { flex: 1; background: #222; border-radius: 2px; }

        /* INPUTS & BUTTONS */
        input, select, textarea { width: 100%; padding: 14px; background: #000; border: 1px solid #333; border-radius: 14px; color: white; margin-bottom: 12px; font-size: 14px; outline: none; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 16px; background: var(--gold); color: #000; border: none; border-radius: 14px; font-weight: 900; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        .btn-copy { background: #0078d4; color: white; margin-top: 10px; }
        .btn-clear { background: transparent; color: #666; font-size: 11px; margin-top: 15px; border: none; cursor: pointer; text-decoration: underline; width: 100%; }

        /* ANALYTICS */
        .chart-container { position: relative; height: 200px; width: 100%; margin-bottom: 20px; }
        .stats-row { display: flex; justify-content: space-around; font-size: 12px; margin-bottom: 25px; font-weight: bold; }
        .history-list { margin-top: 15px; max-height: 180px; overflow-y: auto; border-top: 1px solid #222; padding-top: 10px; }
        .history-item { font-size: 12px; padding: 8px 0; border-bottom: 1px dotted #333; color: #aaa; }

        .news-box { width: 100%; max-width: 420px; border-radius: 28px; overflow: hidden; border: 1px solid #333; margin-bottom: 50px; }
    </style>
</head>
<body>

    <!-- SECTION 1: MARKET STATUS -->
    <div class="master-clock-section">
        <div id="overlapBulb" class="overlap-badge">💡</div>
        <div class="panel-title" style="margin-bottom:5px; font-size:10px; color:#555;">Live Market Clock</div>
        <div id="digitalTime" style="font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 2px;">00:00:00</div>
    </div>

    <div class="session-grid">
        <div class="glass-item"><div class="glass-tube" id="tube-syd"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-syd" style="font-size:8px; color:#444;">SYDNEY</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-tky"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-tky" style="font-size:8px; color:#444;">TOKYO</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ldn"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ldn" style="font-size:8px; color:#444;">LONDON</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ny"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ny" style="font-size:8px; color:#444;">NEW YORK</div></div>
    </div>

    <!-- SECTION 2: CALCULATOR -->
    <div class="app-card">
        <div class="panel-title">Technical Execution</div>
        <div style="display:flex; gap:10px;"><input type="number" id="balance" placeholder="Balance ($)"><input type="number" id="riskPerc" value="10"></div>
        <input type="number" id="price" placeholder="Current Price">
        <div style="display:flex; gap:10px;"><input type="number" id="sh" placeholder="High (SH)"><input type="number" id="sl" placeholder="Low (SL)"></div>
        <select id="maTrend"><option value="up">BULLISH TREND ↑</option><option value="down">BEARISH TREND ↓</option></select>
        <button class="btn-main" onclick="analyze()">Execute Plan</button>
        <div id="resultPanel" style="display:none; margin-top:15px; background:#000; padding:15px; border-radius:15px; border:1px solid #222;">
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>Entry:</span><span id="resEntry" style="color:var(--gold); font-weight:bold;"></span></div>
            <div style="display:flex; justify-content:space-between; font-size:13px;"><span>Lot:</span><span id="resLot" style="color:var(--green); font-weight:bold;"></span></div>
        </div>
    </div>

    <!-- SECTION 3: JOURNAL (AS PER IMAGE) -->
    <div class="analytics-card">
        <div class="panel-title">Trading Journalist</div>
        <div class="chart-container"><canvas id="performanceChart"></canvas></div>
        
        <div class="stats-row">
            <div style="color:var(--green);"><span id="winCount">0</span> WINS</div>
            <div style="color:var(--red);"><span id="lossCount">0</span> LOSSES</div>
            <div style="color:var(--gold);"><span id="winRate">0%</span> RATE</div>
        </div>

        <input type="text" id="jPair" placeholder="Pair (e.g. XAUUSD)">
        <select id="jResult"><option value="Win">WIN</option><option value="Loss">LOSS</option></select>
        <textarea id="jReason" placeholder="Reason..." rows="2"></textarea>
        
        <button class="btn-main" onclick="addToJournal()">Save Trade</button>

        <div id="historyList" class="history-list"></div>
        
        <button class="btn-main btn-copy" onclick="copyForPowerBI()">📋 COPY CSV</button>
        <button class="btn-clear" onclick="clearAllRecord()">CLEAR ALL RECORD</button>
    </div>

    <!-- SECTION 4: NEWS -->
    <div class="news-box">
        <div style="background:#222; padding:8px; font-size:10px; text-align:center; color:var(--gold); font-weight:bold;">HIGH IMPACT NEWS MONITOR</div>
        <iframe src="https://sslecal2.forexprostools.com?columns=exc_curr,exc_importance,exc_actual,exc_prev&importance=2,3&timeZone=55" width="100%" height="350" frameborder="0"></iframe>
    </div>

    <script>
        let myChart;
        function updateEngine() {
            const now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('digitalTime').innerText = now.toLocaleTimeString('en-GB');
            
            const sessions = [ 
                { id:'syd', s:6, e:14, c:'var(--blue)' }, { id:'tky', s:8, e:17, c:'var(--gold)' }, 
                { id:'ldn', s:15, e:24, c:'var(--green)' }, { id:'ny', s:20, e:30, c:'var(--red)' } 
            ];
            
            let activeCount = 0;
            sessions.forEach(sess => {
                let curH = h; if(sess.id==='ny' && h<6) curH=h+24;
                const active = curH >= sess.s && curH < sess.e;
                const blocks = document.getElementById('tube-'+sess.id).getElementsByClassName('block');
                if(active){
                    activeCount++;
                    const totalSec = (sess.e - sess.s) * 3600;
                    const elapsedSec = ((curH - sess.s) * 3600) + (m * 60) + s;
                    const remPerc = 100 - ((elapsedSec / totalSec) * 100);
                    for(let i=0; i<4; i++){
                        let bT = (3-i)*25;
                        if(remPerc > bT+25) blocks[i].style.background = sess.c;
                        else if(remPerc > bT) blocks[i].style.background = `linear-gradient(to top, ${sess.c} ${((remPerc-bT)/25)*100}%, #222 0%)`;
                        else blocks[i].style.background = '#222';
                    }
                } else { for(let b of blocks) b.style.background = '#222'; }
            });
            document.getElementById('overlapBulb').className = activeCount > 1 ? 'overlap-badge overlap-active' : 'overlap-badge';
        }

        function analyze() {
            const bal = parseFloat(document.getElementById('balance').value), SH = parseFloat(document.getElementById('sh').value), SL = parseFloat(document.getElementById('sl').value), trend = document.getElementById('maTrend').value;
            if(!bal || !SH || !SL) return;
            const range = SH-SL;
            let entry = trend==='up' ? SL+(range*0.2) : SH-(range*0.2);
            document.getElementById('resEntry').innerText = entry.toFixed(2);
            document.getElementById('resLot').innerText = (bal*0.01/10).toFixed(2);
            document.getElementById('resultPanel').style.display = 'block';
        }

        function loadAnalytics() {
            const data = JSON.parse(localStorage.getItem('elite_v4_data') || '[]');
            const wins = data.filter(t => t.result === 'Win').length, losses = data.filter(t => t.result === 'Loss').length;
            document.getElementById('winCount').innerText = wins; document.getElementById('lossCount').innerText = losses;
            document.getElementById('winRate').innerText = data.length ? ((wins/data.length)*100).toFixed(0) + "%" : "0%";
            
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type:'doughnut', data:{datasets:[{data:[wins,losses], backgroundColor:['#00ff88','#ff4444'], borderWidth:0}]}, options:{cutout:'85%', plugins:{legend:{display:false}}} });
            document.getElementById('historyList').innerHTML = data.slice().reverse().map(t => `<div class="history-item">${t.pair} - ${t.result}</div>`).join('');
        }

        function addToJournal() {
            const pair = document.getElementById('jPair').value || 'NA', result = document.getElementById('jResult').value, reason = document.getElementById('jReason').value;
            const data = JSON.parse(localStorage.getItem('elite_v4_data') || '[]');
            data.push({ pair, result, reason, date: new Date().toLocaleDateString() });
            localStorage.setItem('elite_v4_data', JSON.stringify(data));
            loadAnalytics();
        }

        function clearAllRecord() {
            if(confirm("Are you sure you want to clear all records? This cannot be undone.")) {
                localStorage.removeItem('elite_v4_data');
                loadAnalytics();
            }
        }

        function copyForPowerBI() {
            const data = JSON.parse(localStorage.getItem('elite_v4_data') || '[]');
            let csv = "Date,Pair,Result,Reason\n";
            data.forEach(t => csv += `${t.date},${t.pair},${t.result},"${t.reason}"\n`);
            navigator.clipboard.writeText(csv); alert("CSV Copied!");
        }

        setInterval(updateEngine, 1000); updateEngine(); loadAnalytics();
    </script>
</body>
</html>
