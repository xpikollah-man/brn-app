<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRN & Harmonic Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', Arial; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .input-group { text-align: left; margin-bottom: 10px; }
        label { font-size: 0.8em; color: #aaa; margin-left: 5px; }
        select, input { padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #444; width: 100%; background: #222; color: white; box-sizing: border-box; }
        button { padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: left; background: #252525; border: 1px dashed #444; }
        .buy-zone { border-left: 5px solid #2ecc71; margin-bottom: 15px; padding-left: 10px; }
        .sell-zone { border-left: 5px solid #e74c3c; padding-left: 10px; }
        .buy-text { color: #2ecc71; font-weight: bold; }
        .sell-text { color: #e74c3c; font-weight: bold; }
        h2 { color: #f1c40f; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [high, setHigh] = useState("");
            const [low, setLow] = useState("");
            const [result, setResult] = useState(null);

            const calculateHarmonic = () => {
                const H = parseFloat(high);
                const L = parseFloat(low);

                if (isNaN(H) || isNaN(L)) return alert("Sila masukkan harga High dan Low!");
                if (L >= H) return alert("Harga High mestilah lebih tinggi daripada Low!");

                const range = H - L;

                // Pengiraan Deep Crab (161.8%)
                // 1. Bullish (Cari Buy di bawah) -> Extension dari High ke Low
                const buyD = L - (range * 0.618); // L - (H-L)*0.618 bersamaan extension 161.8% dari XA
                const buySL = L - (range * 0.90);
                
                // 2. Bearish (Cari Sell di atas) -> Extension dari Low ke High
                const sellD = H + (range * 0.618);
                const sellSL = H + (range * 0.90);

                // BRN terdekat untuk kedua-dua zone
                const getBRN = (price) => {
                    const base = Math.floor(price / 10) * 10;
                    return (price - base >= 5) ? base + 10 : base;
                };

                setResult({
                    buyD: buyD.toFixed(2),
                    buySL: buySL.toFixed(2),
                    buyBRN: getBRN(buyD).toFixed(2),
                    sellD: sellD.toFixed(2),
                    sellSL: sellSL.toFixed(2),
                    sellBRN: getBRN(sellD).toFixed(2),
                });
            };

            return (
                <div className="container">
                    <h2>TRADING ASSISTANT</h2>
                    <p style={{fontSize: "0.8em", color: "#888"}}>Input High & Low Wave untuk 161.8%</p>
                    
                    <div className="input-group">
                        <label>Highest Price (H)</label>
                        <input type="number" placeholder="Cth: 2350.00" value={high} onChange={(e)=>setHigh(e.target.value)} />
                        
                        <label>Lowest Price (L)</label>
                        <input type="number" placeholder="Cth: 2300.00" value={low} onChange={(e)=>setLow(e.target.value)} />
                    </div>
                    
                    <button onClick={calculateHarmonic}>ANALYZE MARKET</button>

                    {result && (
                        <div className="result-box">
                            <div className="sell-zone">
                                <span className="sell-text">BEARISH ZN (SELL)</span>
                                <p style={{margin: "5px 0"}}>Entry D: <b>{result.sellD}</b></p>
                                <p style={{margin: "5px 0", fontSize: "0.85em"}}>BRN: <span style={{color: "#f1c40f"}}>{result.sellBRN}</span></p>
                                <p style={{margin: "5px 0", fontSize: "0.85em"}}>SL: {result.sellSL}</p>
                            </div>
                            
                            <hr style={{borderColor: "#333", margin: "15px 0"}} />

                            <div className="buy-zone">
                                <span className="buy-text">BULLISH ZN (BUY)</span>
                                <p style={{margin: "5px 0"}}>Entry D: <b>{result.buyD}</b></p>
                                <p style={{margin: "5px 0", fontSize: "0.85em"}}>BRN: <span style={{color: "#f1c40f"}}>{result.buyBRN}</span></p>
                                <p style={{margin: "5px 0", fontSize: "0.85em"}}>SL: {result.buySL}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
