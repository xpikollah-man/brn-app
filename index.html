<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dola Trading Assistant</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .app-card { background: #121212; border: 1px solid #333; border-radius: 20px; width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 20px; }
        h2 { color: #f1c40f; text-align: center; font-size: 18px; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        input, select { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: white; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #f1c40f; outline: none; }
        button { width: 100%; padding: 16px; background: #f1c40f; color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:active { transform: scale(0.98); }
        .result-panel { margin-top: 25px; background: #181818; padding: 20px; border-radius: 15px; display: none; border: 1px solid #222; }
        .progress-bg { background: #222; height: 12px; border-radius: 6px; margin: 15px 0; border: 1px solid #333; }
        .progress-bar { height: 100%; width: 0%; border-radius: 6px; transition: width 0.6s ease; }
        .data-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .data-label { color: #666; font-size: 12px; }
        .data-value { font-weight: bold; font-family: monospace; }
        .buy-color { color: #00ff88; }
        .sell-color { color: #ff4444; }
    </style>
</head>
<body>
    <div class="app-card">
        <h2>DOLA ANALYTICS</h2>
        
        <div class="input-group">
            <label>Price Gold (Entry D)</label>
            <input type="number" id="price" step="0.01" placeholder="Cth: 4424.50">
        </div>

        <div class="input-group">
            <label>MA 50 vs MA 200 (Trend)</label>
            <select id="maTrend">
                <option value="up">MA 50 di Atas MA 200 (UP)</option>
                <option value="down">MA 50 di Bawah MA 200 (DOWN)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Price vs MA 50</label>
            <select id="priceVsMa">
                <option value="above">Harga Atas MA 50</option>
                <option value="below">Harga Bawah MA 50</option>
            </select>
        </div>

        <div class="input-group">
            <label>ZigZag Crossing</label>
            <select id="zigzag">
                <option value="up">ZigZag Cross UP</option>
                <option value="down">ZigZag Cross DOWN</option>
            </select>
        </div>

        <button onclick="analyze()">ANALYZE MARKET</button>

        <div id="resultPanel" class="result-panel">
            <div style="text-align:center; font-size:14px; font-weight:bold;">
                SIGNAL STRENGTH: <span id="strengthText">0%</span>
            </div>
            <div class="progress-bg">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="data-row">
                <span class="data-label">DIRECTION</span>
                <span id="resDir" class="data-value"></span>
            </div>
            <div class="data-row">
                <span class="data-label">ENTRY</span>
                <span id="resEntry" class="data-value"></span>
            </div>
            <div class="data-row">
                <span class="data-label">STOP LOSS</span>
                <span id="resSL" class="data-value sell-color"></span>
            </div>
            <div class="data-row">
                <span class="data-label">TP 1:2 (HARMONIC)</span>
                <span id="resTP" class="data-value buy-color"></span>
            </div>
            <div id="advice" style="text-align:center; font-size:10px; color:#555; margin-top:10px;"></div>
        </div>
    </div>

    <script>
        function analyze() {
            const priceInput = document.getElementById('price').value;
            if (!priceInput) {
                alert("Sila masukkan harga gold!");
                return;
            }
            const price = parseFloat(priceInput);
            const maTrend = document.getElementById('maTrend').value;
            const priceVsMa = document.getElementById('priceVsMa').value;
            const zigzag = document.getElementById('zigzag').value;

            let strength = 0;
            // Kita tentukan arah berdasarkan MA Trend dahulu
            let dir = maTrend === "up" ? "BUY" : "SELL";

            // Kira Peratus (%)
            if (dir === "BUY") {
                strength += 25; // Syarat 1: MA 50 > 200
                if (priceVsMa === "above") strength += 25; // Syarat 2: Harga > MA 50
                if (zigzag === "up") strength += 50; // Syarat 3: ZigZag Cross Up
            } else {
                strength += 25; // Syarat 1: MA 50 < 200
                if (priceVsMa === "below") strength += 25; // Syarat 2: Harga < MA 50
                if (zigzag === "down") strength += 50; // Syarat 3: ZigZag Cross Down
            }

            // Pengiraan TP/SL (Harmonic Style)
            // Jarak standard M1 sekitar 8.00 mata
            const risk = 8.00;
            const sl = dir === "BUY" ? (price - risk) : (price + risk);
            const tp = dir === "BUY" ? (price + (risk * 2)) : (price - (risk * 2));

            // Paparkan Result
            const themeColor = dir === "BUY" ? "#00ff88" : "#ff4444";
            document.getElementById('resultPanel').style.display = "block";
            document.getElementById('strengthText').innerText = strength + "%";
            document.getElementById('strengthText').style.color = themeColor;
            
            const bar = document.getElementById('progressBar');
            bar.style.width = strength + "%";
            bar.style.backgroundColor = themeColor;
            bar.style.boxShadow = "0 0 10px " + themeColor;

            document.getElementById('resDir').innerText = dir;
            document.getElementById('resDir').style.color = themeColor;
            document.getElementById('resEntry').innerText = price.toFixed(2);
            document.getElementById('resSL').innerText = sl.toFixed(2);
            document.getElementById('resTP').innerText = tp.toFixed(2);
            
            document.getElementById('advice').innerText = strength >= 75 ? "MOMENTUM KUAT - READY ENTRY" : "TUNGGU CROSSING SEPENUHNYA";
        }
    </script>
</body>
</html>
