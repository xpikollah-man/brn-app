<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPIKOLLAH ANALYSIS HUB</title>
    <style>
        :root { --gold: #f1c40f; --blue: #00d2ff; --red: #ff4444; --green: #00ff88; --bg: #080808; }
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg) 100%);
            background-color: var(--bg);
            color: #e0e0e0; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; margin: 0; min-height: 100vh;
        }
        /* Background Texture */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(45deg, #0f0f0f 25%, transparent 25%), 
                              linear-gradient(-45deg, #0f0f0f 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #0f0f0f 75%), 
                              linear-gradient(-45deg, transparent 75%, #0f0f0f 75%);
            background-size: 4px 4px; z-index: -1; opacity: 0.2;
        }
        /* Clocks Section */
        .clock-container {
            display: grid; grid-template-columns: repeat(5, 1fr);
            width: 100%; max-width: 450px; gap: 5px; margin-bottom: 15px;
            padding: 15px 5px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 1px solid #333;
        }
        .clock-item { display: flex; flex-direction: column; align-items: center; }
        .analog-clock {
            width: 45px; height: 45px; border: 2px solid #444; border-radius: 50%;
            position: relative; background: #111; margin-bottom: 5px;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 10px; }
        .hour-hand { width: 2.5px; height: 12px; z-index: 3; }
        .min-hand { width: 1.5px; height: 18px; z-index: 2; }
        .sec-hand { width: 1px; height: 19px; z-index: 1; background: var(--red); }
        .clock-label { font-size: 7px; font-weight: bold; color: #555; text-transform: uppercase; }
        .clock-label.active { color: var(--gold); }

        /* Main Card */
        .app-card { 
            background: rgba(20, 20, 20, 0.95); border: 1px solid #333; border-radius: 28px; 
            width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            box-sizing: border-box; backdrop-filter: blur(15px); margin-bottom: 20px;
        }
        h2 { color: var(--gold); text-align: center; font-size: 16px; letter-spacing: 3px; margin: 0 0 20px 0; text-transform: uppercase; }
        .input-box { margin-bottom: 12px; }
        label { display: block; font-size: 9px; color: #777; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #0f0f0f; border: 1px solid #333; border-radius: 12px; color: white; font-size: 16px; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: linear-gradient(135deg, #f1c40f, #d4ac0d); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; }

        /* Results Display */
        .result-panel { margin-top: 20px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); display: none; }
        .watch-zone { border-left: 4px solid var(--gold); padding: 12px; background: rgba(241,196,15,0.05); margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 0; border-bottom: 1px solid #222; }

        /* News Section - Filtered USD */
        .news-container { width: 100%; max-width: 420px; border-radius: 24px; overflow: hidden; border: 1px solid #333; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .news-header { background: #1a1a1a; color: var(--gold); padding: 12px; text-align: center; font-size: 11px; font-weight: bold; border-bottom: 1px solid #333; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- Clocks -->
    <div class="clock-container">
        <div class="clock-item"><div class="analog-clock" id="clock-my"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div><div class="clock-label active">MY (GMT+8)</div></div>
        <div class="clock-item"><div class="analog-clock" id="clock-syd"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div><div class="clock-label" id="lbl-syd">SYDNEY</div></div>
        <div class="clock-item"><div class="analog-clock" id="clock-tky"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div><div class="clock-label" id="lbl-tky">TOKYO</div></div>
        <div class="clock-item"><div class="analog-clock" id="clock-ldn"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div><div class="clock-label" id="lbl-ldn">LONDON</div></div>
        <div class="clock-item"><div class="analog-clock" id="clock-ny"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div><div class="clock-label" id="lbl-ny">NEW YORK</div></div>
    </div>

    <!-- Analytics Hub -->
    <div class="app-card">
        <h2>XPIKOLLAH ANALYSIS HUB</h2>
        <div class="input-box"><label>Live Price</label><input type="number" id="price" step="0.01"></div>
        <div class="input-box"><label>Structure</label><select id="maTrend"><option value="up">BULLISH BREAKOUT ↑</option><option value="down">BEARISH BREAKOUT ↓</option></select></div>
        <div style="display:flex; gap:10px;" class="input-box">
            <div style="flex:1"><label>Swing High</label><input type="number" id="sh" step="0.01"></div>
            <div style="flex:1"><label>Swing Low</label><input type="number" id="sl" step="0.01"></div>
        </div>
        <button onclick="analyze()">EXECUTE ANALYTICS</button>
        
        <div id="resultPanel" class="result-panel">
            <div class="watch-zone">
                <div style="font-size: 9px; color: var(--gold); font-weight: bold; margin-bottom: 5px;">REJECTION ZONE (0.5 - 0.2)</div>
                <div id="resWatchZone" style="font-size: 18px; font-weight: bold;"></div>
            </div>
            <div class="data-row"><span>BIAS</span><span id="resBias" style="font-weight:bold;"></span></div>
            <div class="data-row"><span>ENTRY DISYORKAN (0.2)</span><span id="resEntry" style="color:var(--blue); font-weight:bold;"></span></div>
            <div class="data-row"><span>STOP LOSS (RR 1:2)</span><span id="resSl" style="color:var(--red); font-weight:bold;"></span></div>
            <div class="data-row"><span>TARGET TP 2</span><span id="resTp" style="color:var(--green); font-weight:bold;"></span></div>
        </div>
    </div>

    <!-- Live US News Calendar (Filtered USD Only) -->
    <div class="news-container">
        <div class="news-header">🇺🇸 USD HIGH IMPACT NEWS ONLY</div>
        <iframe src="https://sslecal2.forexprostools.com?columns=exc_curr,exc_importance,exc_actual,exc_prev&features=datepicker,timezone&countries=5&calType=day&timeZone=55&lang=1" width="100%" height="450" frameborder="0" allowtransparency="true" marginwidth="0" marginheight="0"></iframe>
    </div>

    <script>
        // Clock Logic
        function updateClocks() {
            const zones = {"clock-my":"Asia/Kuala_Lumpur","clock-syd":"Australia/Sydney","clock-tky":"Asia/Tokyo","clock-ldn":"Europe/London","clock-ny":"America/New_York"};
            for (const [id, zone] of Object.entries(zones)) {
                const now = new Date(new Date().toLocaleString("en-US", {timeZone: zone}));
                const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
                const clock = document.getElementById(id);
                clock.querySelector('.hour-hand').style.transform = `translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
                clock.querySelector('.min-hand').style.transform = `translateX(-50%) rotate(${m*6}deg)`;
                clock.querySelector('.sec-hand').style.transform = `translateX(-50%) rotate(${s*6}deg)`;
                if(id!=="clock-my"){
                    const active = (id==="clock-syd"&&h>=7&&h<16)||(id==="clock-tky"&&h>=9&&h<18)||(id==="clock-ldn"&&h>=8&&h<17)||(id==="clock-ny"&&h>=8&&h<17);
                    document.getElementById('lbl-'+id.split('-')[1]).className = active ? 'clock-label active' : 'clock-label';
                }
            }
        }
        setInterval(updateClocks, 1000); updateClocks();

        // Analytics Logic
        function analyze() {
            const P = parseFloat(document.getElementById('price').value);
            const SH = parseFloat(document.getElementById('sh').value);
            const SL = parseFloat(document.getElementById('sl').value);
            const trend = document.getElementById('maTrend').value;
            
            if (isNaN(P)||isNaN(SH)||isNaN(SL)) return alert("Masukkan data harga!");
            
            const range = SH - SL;
            let e02, e05, tp2, isSell = trend === "down";

            if(isSell){
                e02 = SH - (range * 0.2);
                e05 = SH - (range * 0.5);
                tp2 = SH - (range * 1.618);
            } else {
                e02 = SL + (range * 0.2);
                e05 = SL + (range * 0.5);
                tp2 = SL + (range * 1.618);
            }

            const riskDist = Math.abs(tp2 - e02) / 2;
            const slP = isSell ? (e02 + riskDist) : (e02 - riskDist);

            document.getElementById('resEntry').innerText = e02.toFixed(2);
            document.getElementById('resWatchZone').innerText = isSell ? e02.toFixed(2)+" - "+e05.toFixed(2) : e05.toFixed(2)+" - "+e02.toFixed(2);
            document.getElementById('resSl').innerText = slP.toFixed(2);
            document.getElementById('resTp').innerText = tp2.toFixed(2);
            document.getElementById('resBias').innerText = isSell ? "BEARISH SELL" : "BULLISH BUY";
            document.getElementById('resBias').style.color = isSell ? "var(--red)" : "var(--green)";
            
            document.getElementById('resultPanel').style.display = 'block';
        }
    </script>
</body>
</html>
