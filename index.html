<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRN & Harmonic Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', Arial; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        select, input { padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; width: 100%; background: #222; color: white; box-sizing: border-box; }
        button { padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; border-left: 5px solid #007bff; text-align: left; background: #252525; border-radius: 5px; }
        .buy { color: #2ecc71; font-weight: bold; }
        .sell { color: #e74c3c; font-weight: bold; }
        .info { color: #f1c40f; font-size: 0.9em; margin-bottom: 5px; }
        h2 { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [priceA, setPriceA] = useState(""); // Titik A (High/Low)
            const [priceX, setPriceX] = useState(""); // Titik X (Asal)
            const [timeframe, setTimeframe] = useState("H1");
            const [result, setResult] = useState(null);

            const analyze = () => {
                const A = parseFloat(priceA);
                const X = parseFloat(priceX);

                if (isNaN(A) || isNaN(X)) return alert("Sila masukkan harga X dan A!");

                // 1. Logik Harmonic (Crab Pattern 161.8%)
                const diffXA = Math.abs(A - X);
                const isBullish = A > X; // Jika A lebih tinggi dari X, kita cari Deep Crab Sell di atas
                
                // Titik D adalah 161.8% extension dari X ke A
                const entryD = isBullish ? (X + (diffXA * 1.618)) : (X - (diffXA * 1.618));
                
                // Stop Loss (SL) biasanya di 190% atau 200%
                const sl = isBullish ? (X + (diffXA * 1.90)) : (X - (diffXA * 1.90));
                
                // Take Profit (TP) target pertama di 61.8% retracement dari AD
                const tp1 = isBullish ? (entryD - (Math.abs(entryD - A) * 0.618)) : (entryD + (Math.abs(entryD - A) * 0.618));

                // 2. Logik BRN Terdekat untuk Titik D
                const base = Math.floor(entryD / 10) * 10;
                const brn = (entryD - base >= 5) ? base + 10 : base;

                setResult({
                    type: isBullish ? "BEARISH CRAB (Potential SELL)" : "BULLISH CRAB (Potential BUY)",
                    entry: entryD.toFixed(2),
                    sl: sl.toFixed(2),
                    tp: tp1.toFixed(2),
                    brn: brn.toFixed(2),
                    styleClass: isBullish ? "sell" : "buy"
                });
            };

            return (
                <div className="container">
                    <h2 style={{color: "#f1c40f"}}>Xpikollah Trading Strategy</h2>
                    <p style={{fontSize: "0.8em", color: "#888"}}>Analisis Fibonacci 161.8% + BRN</p>
                    
                    <select value={timeframe} onChange={(e)=>setTimeframe(e.target.value)}>
                        <option value="H1">H1 (Intraday)</option>
                        <option value="H4">H4 (Swing)</option>
                    </select>

                    <input type="number" placeholder="Harga Titik X (Start Leg)" value={priceX} onChange={(e)=>setPriceX(e.target.value)} />
                    <input type="number" placeholder="Harga Titik A (Puncak Leg)" value={priceA} onChange={(e)=>setPriceA(e.target.value)} />
                    
                    <button onClick={analyze}>CALCULATE ENTRY D</button>

                    {result && (
                        <div className="result-box">
                            <div className="info">Pattern: <span className={result.styleClass}>{result.type}</span></div>
                            <hr style={{borderColor: "#444"}} />
                            <p>Potential Entry (D): <b>{result.entry}</b></p>
                            <p>Nearest BRN: <b style={{color: "#f1c40f"}}>{result.brn}</b></p>
                            <p>Stop Loss (SL): <b className="sell">{result.sl}</b></p>
                            <p>Take Profit (TP): <b className="buy">{result.tp}</b></p>
                            <small style={{color: "#888"}}>*Entry terbaik jika D berdekatan dengan BRN.</small>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
