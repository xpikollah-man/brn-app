<script>
    function analyze() {
        const P = parseFloat(document.getElementById('price').value);
        const SH = parseFloat(document.getElementById('sh').value); // Harga tinggi
        const SL_Val = parseFloat(document.getElementById('sl').value); // Harga rendah
        const maTrend = document.getElementById('maTrend').value;

        if (isNaN(P) || isNaN(SH) || isNaN(SL_Val)) {
            alert("Sila masukkan semua harga!");
            return;
        }

        let entryPrice, tp2Price, isSell;

        if (maTrend === "down") {
            // SELL SETUP: Pecah Bawah (0 di Atas [SH], 100 di Bawah [SL])
            isSell = true;
            const range = SH - SL_Val; // Jarak dari 0 ke 100
            entryPrice = SH - (range * 0.2); // 0.2 dari atas ke bawah
            tp2Price = SH - (range * 1.618); // TP2 di bawah
        } else {
            // BUY SETUP: Pecah Atas (0 di Bawah [SL], 100 di Atas [SH])
            isSell = false;
            const range = SH - SL_Val; // Jarak dari 0 ke 100
            entryPrice = SL_Val + (range * 0.2); // 0.2 dari bawah ke atas
            tp2Price = SL_Val + (range * 1.618); // TP2 di atas
        }

        // Logik RR 1:2
        const rewardDist = Math.abs(tp2Price - entryPrice);
        const riskDist = rewardDist / 2;
        const stopLossPrice = isSell ? (entryPrice + riskDist) : (entryPrice - riskDist);

        // BRN terdekat
        const brn = Math.round(P / 25) * 25;

        // Paparkan Keputusan
        document.getElementById('resBrn').innerText = brn.toFixed(2);
        document.getElementById('resEntry').innerText = entryPrice.toFixed(2);
        document.getElementById('resSl').innerText = stopLossPrice.toFixed(2);
        document.getElementById('resTp').innerText = tp2Price.toFixed(2);
        
        const biasEl = document.getElementById('resBias');
        if (!isSell) {
            biasEl.innerText = "BUY @ 0.2 (Pecah Atas)";
            biasEl.style.color = "#00ff88";
        } else {
            biasEl.innerText = "SELL @ 0.2 (Pecah Bawah)";
            biasEl.style.color = "#ff4444";
        }

        document.getElementById('resultPanel').style.display = 'block';
    }
</script>
