<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPIKOLLAH ELITE HUB V4 - POWER BI EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #f1c40f; --blue: #3498db; --red: #e74c3c; --green: #2ecc71; --bg: #0d1117; --card: #161b22; --text: #c9d1d9; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        
        /* Dashboard Stats - Power BI Style */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #30363d; text-align: center; }
        .stat-val { font-size: 18px; font-weight: bold; display: block; margin-top: 5px; }
        .stat-lbl { font-size: 10px; color: #8b949e; text-transform: uppercase; }

        .app-card, .analytics-card { background: var(--card); border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; margin-bottom: 15px; }
        
        /* Clock & Sessions */
        .master-clock-section { background: var(--card); width: 100%; max-width: 420px; padding: 15px; border-radius: 16px; border: 1px solid #30363d; margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center; }
        .digital-time { font-size: 20px; font-weight: bold; color: var(--gold); }
        
        /* Inputs & Buttons */
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 10px; background: #010409; border: 1px solid #30363d; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        button { width: 100%; padding: 12px; background: var(--gold); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        
        /* Journal History List */
        .history-list { margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .history-item { background: #0d1117; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #333; font-size: 11px; }
        .item-win { border-left-color: var(--green); }
        .item-loss { border-left-color: var(--red); }
        
        .chart-container { position: relative; height: 150px; margin: 10px 0; }
        .copy-btn { background: var(--blue); color: white; font-size: 11px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- DIGITAL HEADER -->
    <div class="master-clock-section">
        <div class="digital-time" id="digitalTime">00:00:00</div>
        <div style="font-size: 10px; text-align: right;">
            <span id="overlapText" style="color:var(--gold)">NO OVERLAP</span><br>
            <span style="color:#8b949e">MYSTERY HUB V4</span>
        </div>
    </div>

    <!-- CALCULATOR -->
    <div class="app-card">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 12px; color: var(--gold);">⚡ TRADE EXECUTION PLAN</div>
        <div class="input-group">
            <input type="number" id="balance" placeholder="Balance ($)">
            <input type="number" id="riskPerc" placeholder="Risk %" value="1">
        </div>
        <div class="input-group">
            <input type="number" id="sh" placeholder="High (SH)">
            <input type="number" id="sl" placeholder="Low (SL)">
        </div>
        <select id="maTrend"><option value="up">BULLISH TREND ↑</option><option value="down">BEARISH TREND ↓</option></select>
        <button onclick="analyze()">CALCULATE POSITION</button>
        <div id="resultPanel" style="display:none; margin-top:10px; font-size:12px; background:#0d1117; padding:10px; border-radius:8px;">
            <div id="resEntry"></div>
            <div id="resLot" style="color:var(--gold); font-weight:bold; margin-top:5px;"></div>
        </div>
    </div>

    <!-- DASHBOARD STATS (POWER BI LOOK) -->
    <div class="stats-grid">
        <div class="stat-card"><span class="stat-lbl">Win Rate</span><span class="stat-val" id="winRate" style="color:var(--gold);">0%</span></div>
        <div class="stat-card"><span class="stat-lbl">Total Trades</span><span class="stat-val" id="totalTrades">0</span></div>
        <div class="stat-card"><span class="stat-lbl">Wins</span><span class="stat-val" id="winCount" style="color:var(--green);">0</span></div>
        <div class="stat-card"><span class="stat-lbl">Losses</span><span class="stat-val" id="lossCount" style="color:var(--red);">0</span></div>
    </div>

    <!-- ANALYTICS & JOURNAL -->
    <div class="analytics-card">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--gold);">📊 PERFORMANCE ANALYSIS</div>
        <div class="chart-container"><canvas id="performanceChart"></canvas></div>
        
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-top: 10px;">
            <div style="font-size: 11px; margin-bottom: 10px; font-weight: bold;">LOG NEW TRADE</div>
            <div class="input-group">
                <input type="text" id="jPair" placeholder="Pair (e.g. GOLD)">
                <select id="jResult"><option value="Win">WIN</option><option value="Loss">LOSS</option></select>
            </div>
            <textarea id="jReason" placeholder="Reason for Entry..." rows="2"></textarea>
            <button onclick="addToJournal()">SAVE TO JOURNAL</button>
        </div>

        <div id="historyList" class="history-list"></div>
        <button onclick="copyForPowerBI()" class="copy-btn">📋 COPY DATA FOR POWER BI</button>
        <button onclick="clearJournal()" style="background:transparent; color:#555; font-size:10px; margin-top:10px; border:none;">Reset History</button>
    </div>

    <script>
        let myChart;
        function updateClock() {
            document.getElementById('digitalTime').innerText = new Date().toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);

        function analyze() {
            const bal = parseFloat(document.getElementById('balance').value), risk = parseFloat(document.getElementById('riskPerc').value), SH = parseFloat(document.getElementById('sh').value), SL = parseFloat(document.getElementById('sl').value), trend = document.getElementById('maTrend').value;
            if(!bal || !SH) return;
            const range = SH-SL; let entry = trend === "up" ? SL+(range*0.2) : SH-(range*0.2);
            document.getElementById('resEntry').innerText = "Entry: " + entry.toFixed(2);
            document.getElementById('resLot').innerText = "Rec. Lot: " + (bal*risk/10000).toFixed(2);
            document.getElementById('resultPanel').style.display = 'block';
        }

        async function loadAnalytics() {
            const localData = JSON.parse(localStorage.getItem('myEliteTrades') || '[]');
            const wins = localData.filter(t => t.result === 'Win').length;
            const losses = localData.filter(t => t.result === 'Loss').length;
            
            document.getElementById('winCount').innerText = wins;
            document.getElementById('lossCount').innerText = losses;
            document.getElementById('totalTrades').innerText = localData.length;
            document.getElementById('winRate').innerText = localData.length ? ((wins/localData.length)*100).toFixed(1) + "%" : "0%";

            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Win', 'Loss'], datasets: [{ data: [wins, losses], backgroundColor: ['#2ecc71', '#e74c3c'], borderWidth: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });

            document.getElementById('historyList').innerHTML = localData.slice().reverse().map(t => `
                <div class="history-item ${t.result === 'Win' ? 'item-win' : 'item-loss'}">
                    <div style="display:flex; justify-content:space-between;"><b>${t.pair}</b> <span>${t.result}</span></div>
                    <div style="color:#8b949e; margin-top:5px;">${t.reason}</div>
                    <div style="font-size:9px; color:#555; margin-top:5px;">${t.date}</div>
                </div>
            `).join('');
        }

        function addToJournal() {
            const pair = document.getElementById('jPair').value || 'NA';
            const result = document.getElementById('jResult').value;
