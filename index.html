<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dola BRN + MA Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; }
        .container { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; display: inline-block; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        select, input { padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; width: 100%; background: #222; color: white; box-sizing: border-box; }
        label { display: block; text-align: left; font-size: 12px; color: #aaa; margin-top: 10px; }
        button { padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: left; background: #252525; border-left: 5px solid #444; }
        .buy-box { border-left-color: #27ae60; background: rgba(39, 174, 96, 0.1); }
        .sell-box { border-left-color: #e74c3c; background: rgba(231, 76, 60, 0.1); }
        .strong { font-weight: bold; text-transform: uppercase; font-size: 1.1em; }
        .buy { color: #2ecc71; }
        .sell { color: #e74c3c; }
        .info-text { font-size: 11px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [price, setPrice] = useState("");
            const [maStatus, setMaStatus] = useState("up"); // ma50 > ma200
            const [zigzag, setZigzag] = useState("up"); // zigzag crossing up
            const [result, setResult] = useState(null);

            const analyze = () => {
                const p = parseFloat(price);
                if (isNaN(p)) return alert("Sila masukkan harga!");

                // Logic BRN
                const nearestBR = Math.round(p / 25) * 25;
                
                let signal = "";
                let detail = "";
                let styleClass = "";
                let boxClass = "";

                // TRIPLE CONFIRMATION LOGIC
                // 1. Check MA (Trend)
                // 2. Check Zigzag (Structure/Momentum)
                
                if (maStatus === "up" && zigzag === "up" && p > nearestBR) {
                    signal = "STRONG BUY CONFIRMED";
                    detail = "MA 50 > 200 + Zigzag Cross Up + Above Structure A";
                    styleClass = "buy strong";
                    boxClass = "buy-box";
                } else if (maStatus === "down" && zigzag === "down" && p < nearestBR) {
                    signal = "STRONG SELL CONFIRMED";
                    detail = "MA 50 < 200 + Zigzag Cross Down + Below Structure A";
                    styleClass = "sell strong";
                    boxClass = "sell-box";
                } else {
                    signal = "NEUTRAL / WAITING";
                    detail = "Momentum MA dan Zigzag tidak selari. Sila tunggu Triple Cross.";
                    styleClass = "";
                    boxClass = "";
                }

                setResult({ nearestBR, signal, detail, styleClass, boxClass });
            };

            return (
                <div className="container">
                    <h2 style={{color: "#f1c40f", marginBottom: "5px"}}>DOLA TRADING</h2>
                    <p style={{fontSize: "12px", color: "#888", marginBottom: "20px"}}>BRN + MA 50/200 + ZIGZAG</p>
                    
                    <label>HARGA SEMASA (GOLD)</label>
                    <input type="number" placeholder="Cth: 4424.50" value={price} onChange={(e)=>setPrice(e.target.value)} />

                    <label>STATUS MA 50 & 200</label>
                    <select value={maStatus} onChange={(e)=>setMaStatus(e.target.value)}>
                        <option value="up">MA 50 di ATAS MA 200 (Bullish)</option>
                        <option value="down">MA 50 di BAWAH MA 200 (Bearish)</option>
                    </select>

                    <label>ZIGZAG CROSSING (M1)</label>
                    <select value={zigzag} onChange={(e)=>setZigzag(e.target.value)}>
                        <option value="up">Zigzag Cross Up (Lelapasi MA50)</option>
                        <option value="down">Zigzag Cross Down (Bawah MA50)</option>
                    </select>

                    <button onClick={analyze}>ANALYZE MARKET</button>

                    {result && (
                        <div className={`result-box ${result.boxClass}`}>
                            <p style={{fontSize: "12px", margin: "0"}}>Nearest Zone: <b>{result.nearestBR}</b></p>
                            <p style={{margin: "10px 0"}}>Signal: <span className={result.styleClass}>{result.signal}</span></p>
                            <p style={{fontSize: "11px", lineHeight: "1.4"}}>{result.detail}</p>
                        </div>
                    )}
                    
                    <p className="info-text">*Entry paling padu apabila ZigZag cross kedua-dua MA serentak.</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
