<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpikollah Trading Plan Strategy</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', Arial; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.85em; color: #f1c40f; margin-left: 5px; font-weight: bold; }
        input { padding: 12px; margin: 5px 0 10px 0; border-radius: 8px; border: 1px solid #444; width: 100%; background: #222; color: white; box-sizing: border-box; font-size: 1em; }
        button { padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1em; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: left; background: #252525; border: 1px dashed #444; }
        .buy-zone { border-left: 5px solid #2ecc71; margin-bottom: 15px; padding-left: 12px; }
        .sell-zone { border-left: 5px solid #e74c3c; padding-left: 12px; }
        .buy-text { color: #2ecc71; font-weight: bold; font-size: 1.1em; }
        .sell-text { color: #e74c3c; font-weight: bold; font-size: 1.1em; }
        h2 { color: #f1c40f; margin: 0; font-size: 1.5em; }
        .subtitle { color: #888; font-size: 0.75em; margin-bottom: 20px; letter-spacing: 1px; }
        .brn-highlight { color: #f1c40f; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [high, setHigh] = useState("");
            const [low, setLow] = useState("");
            const [result, setResult] = useState(null);

            // Logik Quarter BRN (0, 25, 50, 75)
            const getQuarterBRN = (price) => {
                const p = parseFloat(price);
                const base = Math.floor(p / 100) * 100; // Contoh: 4512 -> 4500
                const levels = [base, base + 25, base + 50, base + 75, base + 100];
                
                let nearest = levels[0];
                let minDiff = Math.abs(p - levels[0]);

                levels.forEach(l => {
                    const diff = Math.abs(p - l);
                    if (diff < minDiff) {
                        minDiff = diff;
                        nearest = l;
                    }
                });
                return nearest.toFixed(2);
            };

            const analyze = () => {
                const H = parseFloat(high);
                const L = parseFloat(low);

                if (isNaN(H) || isNaN(L)) return alert("Sila masukkan harga High dan Low!");
                if (L >= H) return alert("Harga High mestilah lebih tinggi daripada Low!");

                const range = H - L;

                // Deep Crab 161.8% Calculation
                const sellD = H + (range * 0.618);
                const buyD = L - (range * 0.618);

                setResult({
                    sellD: sellD.toFixed(2),
                    sellBRN: getQuarterBRN(sellD),
                    sellSL: (sellD * 1.002).toFixed(2), // SL buffer 0.2%
                    buyD: buyD.toFixed(2),
                    buyBRN: getQuarterBRN(buyD),
                    buySL: (buyD * 0.998).toFixed(2)  // SL buffer 0.2%
                });
            };

            return (
                <div className="container">
                    <h2>Fikrullah Inra</h2>
                    <div className="subtitle">FRACTAL BRN & HARMONIC 161.8%</div>
                    
                    <div className="input-group">
                        <label>Highest Price (Wave High)</label>
                        <input type="number" placeholder="Cth: 4512.15" value={high} onChange={(e)=>setHigh(e.target.value)} />
                        
                        <label>Lowest Price (Wave Low)</label>
                        <input type="number" placeholder="Cth: 4490.00" value={low} onChange={(e)=>setLow(e.target.value)} />
                    </div>
                    
                    <button onClick={analyze}>ANALYZE MARKET</button>

                    {result && (
                        <div className="result-box">
                            <div className="sell-zone">
                                <span className="sell-text">BEARISH ZN (SELL)</span>
                                <p style={{margin: "8px 0 2px 0"}}>Entry D: <b>{result.sellD}</b></p>
                                <p style={{margin: "2px 0"}}>Zon BRN: <span className="brn-highlight">{result.sellBRN}</span></p>
                                <p style={{margin: "2px 0", fontSize: "0.85em", color: "#aaa"}}>SL: {result.sellSL}</p>
                            </div>
                            
                            <hr style={{borderColor: "#333", margin: "15px 0"}} />

                            <div className="buy-zone">
                                <span className="buy-text">BULLISH ZN (BUY)</span>
                                <p style={{margin: "8px 0 2px 0"}}>Entry D: <b>{result.buyD}</b></p>
                                <p style={{margin: "2px 0"}}>Zon BRN: <span className="brn-highlight">{result.buyBRN}</span></p>
                                <p style={{margin: "2px 0", fontSize: "0.85em", color: "#aaa"}}>SL: {result.buySL}</p>
                            </div>
                            <small style={{display:"block", marginTop: "10px", color: "#666", fontSize: "0.7em"}}>
                                *Fokus entry apabila Entry D berdekatan Zon BRN.
                            </small>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
