<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1338 ELITE TERMINAL</title>
    <style>
        :root { --gold: #f1c40f; --blue: #00d2ff; --red: #ff4444; --green: #00ff88; --bg: #080808; }
        
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg) 100%);
            background-color: var(--bg);
            color: #e0e0e0; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; margin: 0; min-height: 100vh;
        }

        /* Carbon Texture Background */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(45deg, #0f0f0f 25%, transparent 25%), 
                              linear-gradient(-45deg, #0f0f0f 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #0f0f0f 75%), 
                              linear-gradient(-45deg, transparent 75%, #0f0f0f 75%);
            background-size: 4px 4px; z-index: -1; opacity: 0.2;
        }

        /* 5 Analog Clocks Container */
        .clock-container {
            display: grid; grid-template-columns: repeat(5, 1fr);
            width: 100%; max-width: 450px; gap: 5px; margin-bottom: 15px;
            padding: 15px 5px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .clock-item { display: flex; flex-direction: column; align-items: center; }
        .analog-clock {
            width: 45px; height: 45px; border: 2px solid #444; border-radius: 50%;
            position: relative; background: #111; margin-bottom: 5px;
            box-shadow: inset 0 0 8px #000;
        }
        .analog-clock::after {
            content: ''; position: absolute; width: 4px; height: 4px; 
            background: var(--gold); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 10px; }
        .hour-hand { width: 2.5px; height: 12px; z-index: 3; }
        .min-hand { width: 1.5px; height: 18px; z-index: 2; background: #bbb; }
        .sec-hand { width: 1px; height: 19px; z-index: 1; background: var(--red); }
        .clock-label { font-size: 7px; font-weight: bold; color: #555; text-transform: uppercase; text-align: center; }
        .clock-label.active { color: var(--gold); text-shadow: 0 0 5px var(--gold); }

        /* Main Terminal Card */
        .app-card { 
            background: rgba(20, 20, 20, 0.95); border: 1px solid #333; border-radius: 28px; 
            width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            box-sizing: border-box; backdrop-filter: blur(15px);
        }
        h2 { color: var(--gold); text-align: center; font-size: 18px; letter-spacing: 4px; margin: 0 0 20px 0; text-transform: uppercase; text-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }
        
        .input-box { margin-bottom: 12px; width: 100%; }
        label { display: block; font-size: 9px; color: #777; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { 
            width: 100%; padding: 13px; background: #0f0f0f; border: 1px solid #333; 
            border-radius: 12px; color: white; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); background: #151515; }
        
        button { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #f1c40f, #d4ac0d); 
            color: #000; border: none; border-radius: 12px; font-weight: 900; 
            cursor: pointer; font-size: 14px; margin-top: 10px; text-transform: uppercase; transition: 0.2s;
        }
        button:active { transform: scale(0.97); }

        /* Results Display */
        .result-panel { 
            margin-top: 20px; background: rgba(255,255,255,0.02); 
            padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); 
            display: none; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .watch-zone { 
            background: linear-gradient(135deg, rgba(241,196,15,0.1), transparent); 
            border-left: 4px solid var(--gold); padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center;
        }
        .data-row { display: flex; justify-content: space-between; font-size: 14px; padding: 12px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <!-- 5 Analog Clocks -->
    <div class="clock-container">
        <div class="clock-item">
            <div class="analog-clock" id="clock-my"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div>
            <div class="clock-label active">MY (GMT+8)</div>
        </div>
        <div class="clock-item">
            <div class="analog-clock" id="clock-syd"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div>
            <div class="clock-label" id="lbl-syd">SYDNEY</div>
        </div>
        <div class="clock-item">
            <div class="analog-clock" id="clock-tky"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div>
            <div class="clock-label" id="lbl-tky">TOKYO</div>
        </div>
        <div class="clock-item">
            <div class="analog-clock" id="clock-ldn"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div>
            <div class="clock-label" id="lbl-ldn">LONDON</div>
        </div>
        <div class="clock-item">
            <div class="analog-clock" id="clock-ny"><div class="hand hour-hand"></div><div class="hand min-hand"></div><div class="hand sec-hand"></div></div>
            <div class="clock-label" id="lbl-ny">NEW YORK</div>
        </div>
    </div>

    <!-- Analytics Terminal -->
    <div class="app-card">
        <h2>Xpikollah Analysis Hub</h2>
        
        <div class="input-box">
            <label>Live Market Price</label>
            <input type="number" id="price" step="0.01" placeholder="0.00">
        </div>

        <div class="input-box">
            <label>Market Structure</label>
            <select id="maTrend">
                <option value="up">BULLISH BREAKOUT ↑</option>
                <option value="down">BEARISH BREAKOUT ↓</option>
            </select>
        </div>

        <div style="display:flex; gap:10px;" class="input-box">
            <div style="flex:1">
                <label>Swing High</label>
                <input type="number" id="sh" step="0.01" placeholder="High">
            </div>
            <div style="flex:1">
                <label>Swing Low</label>
                <input type="number" id="sl" step="0.01" placeholder="Low">
            </div>
        </div>

        <button onclick="analyze()">Execute Analytics</button>

        <div id="resultPanel" class="result-panel">
            <div class="watch-zone">
                <div style="font-size: 10px; color: var(--gold); font-weight: bold; letter-spacing: 1px;">REJECTION ZONE (0.5 - 0.2)</div>
                <div id="resWatchZone" style="font-size: 20px; font-weight: bold; color: #fff; margin-top:5px;"></div>
            </div>

            <div class="data-row"><span>BIAS DIRECTION</span><span id="resBias" style="font-weight:bold;"></span></div>
            <div class="data-row"><span>NEAREST BRN</span><span id="resBrn" style="color:var(--gold); font-weight:bold;"></span></div>
            <div class="data-row"><span>ENTRY DISYORKAN (0.2)</span><span id="resEntry" style="color:var(--blue); font-weight:bold;"></span></div>
            <div class="data-row"><span>STOP LOSS (RR 1:2)</span><span id="resSl" style="color:var(--red); font-weight:bold;"></span></div>
            <div class="data-row"><span>TARGET TP 2 WAJIB</span><span id="resTp" style="color:var(--green); font-weight:bold;"></span></div>
        </div>
    </div>

    <script>
        // Clock Logic
        function updateClocks() {
            const zones = {
                "clock-my": "Asia/Kuala_Lumpur",
                "clock-syd": "Australia/Sydney",
                "clock-tky": "Asia/Tokyo",
                "clock-ldn": "Europe/London",
                "clock-ny": "America/New_York"
            };

            for (const [id, zone] of Object.entries(zones)) {
                const now = new Date(new Date().toLocaleString("en-US", {timeZone: zone}));
                const h = now.getHours();
                const m = now.getMinutes();
                const s = now.getSeconds();

                const hDeg = (h % 12) * 30 + m * 0.5;
                const mDeg = m * 6;
                const sDeg = s * 6;

                const clock = document.getElementById(id);
                clock.querySelector('.hour-hand').style.transform = `translateX(-50%) rotate(${hDeg}deg)`;
                clock.querySelector('.min-hand').style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
                clock.querySelector('.sec-hand').style.transform = `translateX(-50%) rotate(${sDeg}deg)`;

                // Session Highlighting
                if(id === "clock-syd") document.getElementById('lbl-syd').className = (h >= 7 && h < 16) ? 'clock-label active' : 'clock-label';
                if(id === "clock-tky") document.getElementById('lbl-tky').className = (h >= 9 && h < 18) ? 'clock-label active' : 'clock-label';
                if(id === "clock-ldn") document.getElementById('lbl-ldn').className = (h >= 8 && h < 17) ? 'clock-label active' : 'clock-label';
                if(id === "clock-ny") document.getElementById('lbl-ny').className = (h >= 8 && h < 17) ? 'clock-label active' : 'clock-label';
            }
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        // Analytics Logic
        function analyze() {
            const P = parseFloat(document.getElementById('price').value);
            const SH = parseFloat(document.getElementById('sh').value);
            const SL = parseFloat(document.getElementById('sl').value);
            const trend = document.getElementById('maTrend').value;

            if (isNaN(P) || isNaN(SH) || isNaN(SL)) return alert("Sila masukkan data harga!");

            const range = SH - SL;
            let e02, e05, tp2, isSell = trend === "down";

            if (isSell) {
                // Sell: 0 di High, 100 di Low
                e02 = SH - (range * 0.2);
                e05 = SH - (range * 0.5);
                tp2 = SH - (range * 1.618);
            } else {
                // Buy: 0 di Low, 100 di High
                e02 = SL + (range * 0.2);
                e05 = SL + (range * 0.5);
                tp2 = SL + (range * 1.618);
            }

            // Fixed RR 1:2
            const rewardDist = Math.abs(tp2 - e02);
            const riskDist = rewardDist / 2;
            const slPrice = isSell ? (e02 + riskDist) : (e02 - riskDist);

            document.getElementById('resBrn').innerText = (Math.round(P / 25) * 25).toFixed(2);
            document.getElementById('resEntry').innerText = e02.toFixed(2);
            document.getElementById('resWatchZone').innerText = isSell ? 
                e02.toFixed(2) + " - " + e05.toFixed(2) : 
                e05.toFixed(2) + " - " + e02.toFixed(2);
            document.getElementById('resSl').innerText = slPrice.toFixed(2);
            document.getElementById('resTp').innerText = tp2.toFixed(2);
            
            const b = document.getElementById('resBias');
            b.innerText = isSell ? "BEARISH SELL" : "BULLISH BUY";
            b.style.color = isSell ? "var(--red)" : "var(--green)";

            document.getElementById('resultPanel').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
