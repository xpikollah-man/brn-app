<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPIKOLLAH ELITE HUB V4 - OVERLAP SIGNAL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #f1c40f; --blue: #00d2ff; --red: #ff4444; --green: #00ff88; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        
        /* OVERLAP & CLOCK SECTION */
        .master-clock-section { background: rgba(255,255,255,0.03); width: 100%; max-width: 420px; padding: 20px; border-radius: 28px; border: 1px solid #222; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .overlap-bulb { position: absolute; top: 15px; right: 20px; font-size: 24px; filter: grayscale(1); transition: 0.3s; }
        .bulb-active { filter: grayscale(0) drop-shadow(0 0 10px var(--gold)); color: var(--gold); }
        .overlap-text { font-size: 10px; font-weight: bold; margin-top: 5px; color: #444; }
        .overlap-alert { color: var(--gold); }

        .analog-master { width: 80px; height: 80px; border: 3px solid #333; border-radius: 50%; position: relative; background: #111; margin-bottom: 10px; }
        .master-hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 10px; }
        .m-hour { width: 3px; height: 25px; z-index: 3; } .m-min { width: 2px; height: 35px; z-index: 2; } .m-sec { width: 1px; height: 38px; z-index: 1; background: var(--gold); }

        /* SESSION GRID */
        .session-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 420px; gap: 10px; margin-bottom: 15px; }
        .glass-item { background: #151515; padding: 15px 5px; border-radius: 15px; border: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        .glass-tube { width: 18px; height: 70px; display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
        .block { flex: 1; background: #222; border-radius: 3px; }
        .lbl-session { font-size: 8px; font-weight: bold; color: #444; text-transform: uppercase; }

        /* CARDS */
        .app-card, .analytics-card { background: #141414; border: 1px solid #333; border-radius: 28px; width: 100%; max-width: 420px; padding: 25px; box-sizing: border-box; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 12px; color: white; margin-bottom: 10px; font-size: 13px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        
        .chart-container { position: relative; height: 180px; width: 100%; margin: 10px 0; }
        .news-box { width: 100%; max-width: 420px; background: #141414; border-radius: 24px; overflow: hidden; border: 1px solid #333; margin-bottom: 30px;}
    </style>
</head>
<body>

    <div class="master-clock-section">
        <div id="bulb" class="overlap-bulb">💡</div>
        <div class="analog-master"><div class="master-hand m-hour"></div><div class="master-hand m-min"></div><div class="master-hand m-sec"></div></div>
        <div id="digitalTime" style="font-size: 18px; font-weight: bold;">00:00:00</div>
        <div id="overlapStatus" class="overlap-text">NO OVERLAP</div>
    </div>

    <div class="session-grid">
        <div class="glass-item"><div class="glass-tube" id="tube-syd"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-syd" class="lbl-session">Sydney</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-tky"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-tky" class="lbl-session">Tokyo</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ldn"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ldn" class="lbl-session">London</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ny"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ny" class="lbl-session">New York</div></div>
    </div>

    <div class="app-card">
        <div style="font-size: 11px; color: var(--gold); font-weight: bold; margin-bottom: 15px; text-align: center;">BRN & FIBO EXECUTION</div>
        <div style="display:flex; gap:10px;"><input type="number" id="balance" placeholder="Bal ($)"><input type="number" id="riskPerc" value="10"></div>
        <input type="number" id="price" placeholder="Current Price">
        <div style="display:flex; gap:10px;"><input type="number" id="sh" placeholder="High"><input type="number" id="sl" placeholder="Low"></div>
        <select id="maTrend"><option value="up">BULLISH (MA 50 > 200) ↑</option><option value="down">BEARISH (MA 50 < 200) ↓</option></select>
        <button onclick="analyze()">EXECUTE TRADE PLAN</button>
        <div id="resultPanel" style="display:none; margin-top:15px; font-size:12px; background:rgba(255,255,255,0.02); padding:10px; border-radius:12px;">
            Entry: <span id="resEntry" style="color:var(--gold)"></span> | SL: <span id="resSl"></span> | TP: <span id="resTp" style="color:var(--green)"></span><br>
            Lot: <span id="resLot" style="color:var(--gold)"></span>
        </div>
    </div>

    <div class="analytics-card">
        <div class="chart-container"><canvas id="performanceChart"></canvas></div>
        <div style="display:flex; justify-content:space-around; font-size:11px;">
            <div><span id="winCount">0</span> WINS</div>
            <div><span id="lossCount">0</span> LOSSES</div>
            <div><span id="winRate">0%</span> RATE</div>
        </div>
        <div style="margin-top:15px;"><input type="text" id="jPair" placeholder="Pair"><select id="jResult"><option value="Win">WIN</option><option value="Loss">Loss</option></select><button onclick="addToJournal()">SAVE</button></div>
        <div id="historyList" style="margin-top:10px; max-height:150px; overflow-y:auto;"></div>
        <button onclick="copyForPowerBI()" style="background:#0078d4; color:white; margin-top:10px; padding:10px; font-size:11px;">COPY FOR POWER BI</button>
    </div>

    <div class="news-box">
        <iframe src="https://sslecal2.forexprostools.com?columns=exc_curr,exc_importance,exc_actual,exc_prev&features=datepicker,timezone&countries=5&calType=day&timeZone=55&lang=1&importance=2,3" width="100%" height="400" frameborder="0"></iframe>
    </div>

    <script>
        let myChart;
        function updateEngine() {
            const now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('digitalTime').innerText = now.toLocaleTimeString('en-GB');
            document.querySelector('.m-hour').style.transform = `translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
            document.querySelector('.m-min').style.transform = `translateX(-50%) rotate(${m*6}deg)`;
            document.querySelector('.m-sec').style.transform = `translateX(-50%) rotate(${s*6}deg)`;
            
            const sessions = [{id:'syd',s:6,e:14,c:'var(--blue)'},{id:'tky',s:8,e:17,c:'var(--gold)'},{id:'ldn',s:15,e:24,c:'var(--green)'},{id:'ny',s:20,e:30,c:'var(--red)'}];
            let activeCount = 0;
            sessions.forEach(sess => {
                let curH = h; if(sess.id==='ny' && h<6) curH=h+24;
                const active = curH >= sess.s && curH < sess.e;
                if(active) activeCount++;
                const blocks = document.getElementById('tube-'+sess.id).getElementsByClassName('block');
                for(let b of blocks) b.style.background = active ? sess.c : '#222';
            });

            const bulb = document.getElementById('bulb');
            const status = document.getElementById('overlapStatus');
            if(activeCount >= 2) { bulb.classList.add('bulb-active'); status.innerText = "OVERLAP ALERT (VOLATILE)"; status.classList.add('overlap-alert'); }
            else { bulb.classList.remove('bulb-active'); status.innerText = "NO OVERLAP"; status.classList.remove('overlap-alert'); }
        }
        setInterval(updateEngine, 1000);

        function analyze() {
            const bal = parseFloat(document.getElementById('balance').value), SH = parseFloat(document.getElementById('sh').value), SL = parseFloat(document.getElementById('sl').value), trend = document.getElementById('maTrend').value;
            const range = SH - SL;
            let entry = trend === "up" ? SL + (range * 0.2) : SH - (range * 0.2);
            let tp = trend === "up" ? SL + (range * 1.618) : SH - (range * 1.618);
            document.getElementById('resEntry').innerText = entry.toFixed(2);
            document.getElementById('resTp').innerText = tp.toFixed(2);
            document.getElementById('resLot').innerText = (bal * 0.1 / 100).toFixed(2); // Mock lot
            document.getElementById('resultPanel').style.display = 'block';
        }

        function loadAnalytics() {
            const data = JSON.parse(localStorage.getItem('myEliteTrades') || '[]');
            const wins = data.filter(t => t.result === 'Win').length, losses = data.filter(t => t.result === 'Loss').length;
            document.getElementById('winCount').innerText = wins; document.getElementById('lossCount').innerText = losses;
            document.getElementById('winRate').innerText = data.length ? ((wins/data.length)*100).toFixed(0) + "%" : "0%";
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type:'doughnut', data:{datasets:[{data:[wins,losses], backgroundColor:['#00ff88','#ff4444'], borderWidth:0}]}, options:{cutout:'80%', plugins:{legend:{display:false}}} });
            document.getElementById('historyList').innerHTML = data.slice().reverse().map(t => `<div style="font-size:10px; margin-bottom:5px;">${t.pair} - ${t.result}</div>`).join('');
        }

        function addToJournal() {
            const pair = document.getElementById('jPair').value || 'XAUUSD', result = document.getElementById('jResult').value;
            const data = JSON.parse(localStorage.getItem('myEliteTrades') || '[]');
            data.push({ pair, result, date: new Date().toLocaleDateString() });
            localStorage.setItem('myEliteTrades', JSON.stringify(data));
            loadAnalytics();
        }

        loadAnalytics(); updateEngine();
    </script>
</body>
</html>
