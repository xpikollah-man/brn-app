<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPIKOLLAH ELITE HUB V4</title>
    <style>
        :root { --gold: #f1c40f; --blue: #00d2ff; --red: #ff4444; --green: #00ff88; --bg: #0a0a0a; }
        body { 
            background-color: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0;
        }

        .master-clock-section {
            background: rgba(255,255,255,0.03); width: 100%; max-width: 420px;
            padding: 20px; border-radius: 28px; border: 1px solid #222; margin-bottom: 15px;
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .analog-master {
            width: 80px; height: 80px; border: 3px solid #333; border-radius: 50%;
            position: relative; background: #111; margin-bottom: 10px;
        }
        .master-hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 10px; }
        .m-hour { width: 3px; height: 25px; z-index: 3; }
        .m-min { width: 2px; height: 35px; z-index: 2; }
        .m-sec { width: 1px; height: 38px; z-index: 1; background: var(--gold); }

        .session-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            width: 100%; max-width: 420px; gap: 10px; margin-bottom: 15px;
        }
        .glass-item {
            background: #151515; padding: 15px 5px; border-radius: 15px; border: 1px solid #222;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .glass-tube {
            width: 18px; height: 70px; 
            display: flex; flex-direction: column; 
            gap: 3px; 
            margin-bottom: 8px;
        }
        .block {
            flex: 1; background: #222; border-radius: 3px;
            transition: background 0.3s ease;
        }

        .lbl-session { font-size: 8px; font-weight: bold; color: #444; text-transform: uppercase; margin-top: 4px; }
        
        .active-syd { color: var(--blue) !important; }
        .active-tky { color: var(--gold) !important; }
        .active-ldn { color: var(--green) !important; }
        .active-ny { color: var(--red) !important; }

        .app-card { 
            background: #141414; border: 1px solid #333; border-radius: 28px; 
            width: 100%; max-width: 420px; padding: 25px; box-sizing: border-box; margin-bottom: 15px;
        }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 12px; color: white; margin-bottom: 10px; font-size: 15px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        
        .result-panel { margin-top: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 20px; display: none; }
        .data-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #222; }

        .news-box {
            width: 100%; max-width: 420px; background: #1a1a1a; border-radius: 24px; 
            overflow: hidden; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .news-header { background: #222; color: var(--gold); padding: 12px; text-align: center; font-size: 11px; font-weight: bold; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div class="master-clock-section">
        <div style="font-size: 10px; color: #888; margin-bottom: 5px;">MALAYSIA (GMT+8)</div>
        <div class="analog-master" id="masterClock">
            <div class="master-hand m-hour"></div><div class="master-hand m-min"></div><div class="master-hand m-sec"></div>
        </div>
        <div id="digitalTime" style="font-size: 18px; font-weight: bold; letter-spacing: 2px;">00:00:00</div>
    </div>

    <div class="session-grid">
        <div class="glass-item"><div class="glass-tube" id="tube-syd"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-syd" class="lbl-session">Sydney</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-tky"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-tky" class="lbl-session">Tokyo</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ldn"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ldn" class="lbl-session">London</div></div>
        <div class="glass-item"><div class="glass-tube" id="tube-ny"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div id="lbl-ny" class="lbl-session">New York</div></div>
    </div>

    <!-- Analytics & News -->
    <div class="app-card">
        <input type="number" id="price" placeholder="Live Price">
        <select id="maTrend"><option value="up">BULLISH ↑</option><option value="down">BEARISH ↓</option></select>
        <div style="display:flex; gap:10px;"><input type="number" id="sh" placeholder="High" style="flex:1"><input type="number" id="sl" placeholder="Low" style="flex:1"></div>
        <button onclick="analyze()">EXECUTE ANALYTICS</button>
        <div id="resultPanel" class="result-panel">
            <div class="data-row"><span>BIAS</span><span id="resBias" style="font-weight:bold;"></span></div>
            <div class="data-row"><span>ENTRY (0.2)</span><span id="resEntry" style="color:var(--blue); font-weight:bold;"></span></div>
            <div class="data-row"><span>STOP LOSS</span><span id="resSl" style="color:var(--red); font-weight:bold;"></span></div>
            <div class="data-row"><span>TP 2</span><span id="resTp" style="color:var(--green); font-weight:bold;"></span></div>
        </div>
    </div>

    <div class="news-box">
        <div class="news-header">🇺🇸 USD LIVE NEWS</div>
        <iframe src="https://sslecal2.forexprostools.com?columns=exc_curr,exc_importance,exc_actual,exc_prev&features=datepicker,timezone&countries=5&calType=day&timeZone=55&lang=1&importance=2,3" width="100%" height="450" frameborder="0" allowtransparency="true"></iframe>
    </div>

    <script>
        function updateEngine() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('digitalTime').innerText = now.toLocaleTimeString('en-GB');
            document.querySelector('.m-hour').style.transform = `translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
            document.querySelector('.m-min').style.transform = `translateX(-50%) rotate(${m*6}deg)`;
            document.querySelector('.m-sec').style.transform = `translateX(-50%) rotate(${s*6}deg)`;

            const sessions = [
                { id: 'syd', start: 6, end: 14, color: 'var(--blue)', cls: 'active-syd' },
                { id: 'tky', start: 8, end: 17, color: 'var(--gold)', cls: 'active-tky' },
                { id: 'ldn', start: 15, end: 24, color: 'var(--green)', cls: 'active-ldn' },
                { id: 'ny', start: 20, end: 30, color: 'var(--red)', cls: 'active-ny' }
            ];

            sessions.forEach(sess => {
                let currentH = h;
                if (sess.id === 'ny' && h < 6) currentH = h + 24; 
                
                const isActive = currentH >= sess.start && currentH < sess.end;
                const blocks = document.getElementById('tube-' + sess.id).getElementsByClassName('block');
                const lbl = document.getElementById('lbl-' + sess.id);

                if (isActive) {
                    const totalSec = (sess.end - sess.start) * 3600;
                    const elapsedSec = (currentH - sess.start) * 3600 + m * 60 + s;
                    const remainingProgress = ((totalSec - elapsedSec) / totalSec) * 100;
                    lbl.className = 'lbl-session ' + sess.cls;

                    for (let i = 0; i < 4; i++) {
                        let blockThreshold = (3 - i + 1) * 25; 
                        let lowerThreshold = (3 - i) * 25;
                        if (remainingProgress >= blockThreshold) {
                            blocks[i].style.background = sess.color;
                        } else if (remainingProgress > lowerThreshold) {
                            let subProgress = ((remainingProgress - lowerThreshold) / 25) * 100;
                            blocks[i].style.background = `linear-gradient(to top, ${sess.color} ${subProgress}%, #222 0%)`;
                        } else {
                            blocks[i].style.background = '#222';
                        }
                    }
                } else {
                    lbl.className = 'lbl-session';
                    for (let b of blocks) b.style.background = '#222';
                }
            });
        }
        setInterval(updateEngine, 1000); updateEngine();

        function analyze() {
            const P = parseFloat(document.getElementById('price').value), SH = parseFloat(document.getElementById('sh').value), SL = parseFloat(document.getElementById('sl').value), trend = document.getElementById('maTrend').value;
            if (isNaN(P)||isNaN(SH)||isNaN(SL)) return;
            const range = SH - SL; let e02, tp2, isSell = trend === "down";
            if(isSell){ e02 = SH-(range*0.2); tp2 = SH-(range*1.618); }
            else { e02 = SL+(range*0.2); tp2 = SL+(range*1.618); }
            const slP = isSell ? (e02 + Math.abs(tp2-e02)/2) : (e02 - Math.abs(tp2-e02)/2);
            document.getElementById('resEntry').innerText = e02.toFixed(2);
            document.getElementById('resSl').innerText = slP.toFixed(2);
            document.getElementById('resTp').innerText = tp2.toFixed(2);
            document.getElementById('resBias').innerText = isSell ? "SELL" : "BUY";
            document.getElementById('resBias').style.color = isSell ? "var(--red)" : "var(--green)";
            document.getElementById('resultPanel').style.display = 'block';
        }
    </script>
</body>
</html>
